<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enricher</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .placeholder {
      text-align: center;
      color: #8b949e;
    }
    .placeholder h1 {
      font-size: 24px;
      font-weight: 600;
      color: #58a6ff;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="placeholder">
    <h1>Enricher online</h1>
    <p>Interface em construção — tarefas 02–07</p>
  </div>
  <div id="app">
    <section id="news-section" style="
      width: 100%;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
    ">
      <h2 style="color:#58a6ff; margin-bottom:1rem; font-size:18px;">Buscar notícias de mentor</h2>

      <div style="display:flex; gap:.5rem; margin-bottom:1.5rem;">
        <input
          id="mentor-name"
          type="text"
          placeholder="Nome do mentor"
          style="
            flex:1;
            padding:.5rem .75rem;
            background:#161b22;
            border:1px solid #30363d;
            border-radius:6px;
            color:#e6edf3;
            font-size:14px;
            outline:none;
          "
        />
        <button
          id="btn-enrich"
          style="
            padding:.5rem 1rem;
            background:#238636;
            border:none;
            border-radius:6px;
            color:#fff;
            font-size:14px;
            cursor:pointer;
          "
        >Buscar notícias</button>
      </div>

      <div id="news-status" style="color:#8b949e; margin-bottom:.75rem; font-size:13px;"></div>

      <ul id="news-list" style="list-style:none; display:flex; flex-direction:column; gap:.75rem;"></ul>
    </section>

    <!-- Seção Síntese AI -->
    <section id="synthesis-section" style="width:100%; max-width:720px; margin:2rem auto; padding:0 1rem; display:none;">
      <h2 style="color:#58a6ff; margin-bottom:1rem; font-size:18px;">Perfil AI</h2>
      <div id="synthesis-result"></div>
    </section>
  </div>

  <script type="module">
    const btnEnrich        = document.getElementById('btn-enrich');
    const inputName        = document.getElementById('mentor-name');
    const statusEl         = document.getElementById('news-status');
    const newsList         = document.getElementById('news-list');
    const synthesisSection = document.getElementById('synthesis-section');
    const synthesisResult  = document.getElementById('synthesis-result');

    btnEnrich.addEventListener('click', async () => {
      const name = inputName.value.trim();
      if (!name) { statusEl.textContent = 'Informe o nome do mentor.'; return; }

      btnEnrich.disabled = true;
      statusEl.textContent = 'Buscando notícias…';
      newsList.innerHTML = '';

      try {
        const res  = await fetch('/api/enrich', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        const data = await res.json();

        if (!res.ok) { statusEl.textContent = `Erro: ${data.error}`; return; }

        const { news = [], mentorId } = data;
        statusEl.textContent = news.length
          ? `${news.length} notícia(s) encontrada(s) — ID mentor: ${mentorId}`
          : 'Nenhuma notícia encontrada.';

        // Offer "Sintetizar perfil" button when we have a mentorId
        if (mentorId) {
          synthesisSection.style.display = 'block';
          synthesisResult.innerHTML = `
            <button
              id="btn-synthesize"
              data-mentor-id="${mentorId}"
              style="
                padding:.5rem 1rem;
                background:#1f6feb;
                border:none;
                border-radius:6px;
                color:#fff;
                font-size:14px;
                cursor:pointer;
                margin-bottom:1rem;
              "
            >Sintetizar perfil</button>
            <div id="synthesis-status" style="color:#8b949e; font-size:13px;"></div>
          `;
          document.getElementById('btn-synthesize').addEventListener('click', () => runSynthesize(mentorId));
        }

        for (const item of news) {
          const li = document.createElement('li');
          li.style.cssText = `
            background:#161b22;
            border:1px solid #30363d;
            border-radius:8px;
            padding:.75rem 1rem;
          `;
          li.innerHTML = `
            <div style="margin-bottom:.25rem;">
              <a href="${escHtml(item.url)}" target="_blank" rel="noopener"
                 style="color:#58a6ff; text-decoration:none; font-weight:600; font-size:14px;">
                ${escHtml(item.title)}
              </a>
            </div>
            <div style="font-size:12px; color:#8b949e; margin-bottom:.35rem;">
              ${item.date ? escHtml(item.date) : 'Data desconhecida'}
              &nbsp;·&nbsp;
              <span style="
                background:${item.source === 'bing' ? '#1f3a5f' : '#3a2d00'};
                color:${item.source === 'bing' ? '#79c0ff' : '#e3b341'};
                border-radius:4px; padding:1px 6px; font-size:11px;
              ">${escHtml(item.source)}</span>
            </div>
            ${item.snippet
              ? `<div style="color:#c9d1d9; font-size:13px; line-height:1.5;">${escHtml(item.snippet)}</div>`
              : ''}
          `;
          newsList.appendChild(li);
        }
      } catch (err) {
        statusEl.textContent = `Erro de rede: ${err.message}`;
      } finally {
        btnEnrich.disabled = false;
      }
    });

    // Pressionar Enter no input aciona a busca
    inputName.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnEnrich.click();
    });

    function escHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function runSynthesize(mentorId) {
      const btn = document.getElementById('btn-synthesize');
      const synthStatus = document.getElementById('synthesis-status');
      if (btn) btn.disabled = true;
      if (synthStatus) synthStatus.textContent = 'Sintetizando perfil com IA…';

      try {
        const res  = await fetch(`/api/enrich/${mentorId}/synthesize`, { method: 'POST' });
        const data = await res.json();

        if (!res.ok) {
          if (synthStatus) synthStatus.textContent = `Erro: ${data.error}`;
          return;
        }

        const { profile } = data;
        if (synthStatus) synthStatus.textContent = '';
        renderProfile(profile);
      } catch (err) {
        if (synthStatus) synthStatus.textContent = `Erro de rede: ${err.message}`;
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function renderProfile(profile) {
      if (!profile) return;

      const qualityColors = { alta: '#3fb950', média: '#e3b341', baixa: '#f85149' };
      const qualityColor  = qualityColors[profile.dataQuality] ?? '#8b949e';

      // TLDR
      const tldrHtml = profile.tldr
        ? `<div style="
            background:#161b22;
            border-left:3px solid #58a6ff;
            border-radius:4px;
            padding:.75rem 1rem;
            font-size:15px;
            color:#e6edf3;
            font-weight:600;
            margin-bottom:1rem;
          ">${escHtml(profile.tldr)}</div>`
        : '';

      // dataQuality badge
      const qualityHtml = `<span style="
        background:${qualityColor}22;
        color:${qualityColor};
        border:1px solid ${qualityColor};
        border-radius:12px;
        padding:2px 10px;
        font-size:12px;
        font-weight:600;
        margin-bottom:1rem;
        display:inline-block;
      ">Qualidade: ${escHtml(profile.dataQuality ?? 'n/a')}</span>`;

      // Topics badges
      const topicsHtml = Array.isArray(profile.topics) && profile.topics.length
        ? `<div style="display:flex; flex-wrap:wrap; gap:.4rem; margin:1rem 0;">
            ${profile.topics.map((t) => `<span style="
              background:#1f3a5f;
              color:#79c0ff;
              border-radius:12px;
              padding:3px 10px;
              font-size:12px;
            ">${escHtml(t)}</span>`).join('')}
          </div>`
        : '';

      // Timeline
      const timelineHtml = Array.isArray(profile.timeline) && profile.timeline.length
        ? `<div style="margin-top:1rem;">
            <h3 style="color:#8b949e; font-size:13px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:.5rem;">Linha do tempo</h3>
            <ul style="list-style:none; display:flex; flex-direction:column; gap:.5rem;">
              ${profile.timeline
                .filter((e) => e.source)
                .map((e) => `<li style="
                  display:flex; gap:.75rem; align-items:baseline;
                  background:#161b22; border:1px solid #30363d;
                  border-radius:6px; padding:.5rem .75rem;
                ">
                  <span style="color:#58a6ff; font-size:12px; font-weight:700; white-space:nowrap;">${escHtml(e.year)}</span>
                  <span style="color:#c9d1d9; font-size:13px; flex:1;">${escHtml(e.event)}</span>
                  <a href="${escHtml(e.source)}" target="_blank" rel="noopener"
                     style="color:#8b949e; font-size:11px; white-space:nowrap; text-decoration:none;">↗ fonte</a>
                </li>`).join('')}
            </ul>
          </div>`
        : '';

      synthesisResult.innerHTML = `
        ${tldrHtml}
        <div style="margin-bottom:.5rem;">${qualityHtml}</div>
        ${topicsHtml}
        ${timelineHtml}
        <button
          id="btn-synthesize"
          data-mentor-id="${synthesisResult.querySelector ? '' : ''}"
          style="
            display:none;
          "
        >Sintetizar perfil</button>
      `;
    }
  </script>
</body>
</html>
